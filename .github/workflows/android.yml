name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'JARVIS_Android_Starter.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip JARVIS_Android_Starter.zip -d jarvis

      - name: Fix Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("jarvis/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              "    defaultConfig {",
              """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              defaultConfig {"""
          )
          p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd jarvis
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: jarvis/app/build/outputs/apk/debug/app-debug.apk
